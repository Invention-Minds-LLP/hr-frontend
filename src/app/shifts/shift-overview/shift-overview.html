<!-- Submenu -->
<div class="guide">
    <app-module-guide
  title="Shift Management"
  subtitle="Configure, assign, and manage employee shift schedules and rotation patterns."
  [points]="[
    { label: 'Employee Shifts', desc: 'View and assign fixed or rotation-based shift schedules to employees.' },
    { label: 'Shift Requests', desc: 'Review shift-change requests submitted by employees or their managers.' },
    { label: 'Manager Shift Setup', desc: 'HR and managers can define shift timings, week-off days, and monthly patterns.' },
    { label: 'Rotation Patterns', desc: 'Set up rotating schedules (e.g. Morning/Evening/Night) that auto-apply week by week.' }
  ]">
</app-module-guide>
</div>
