<!-- Submenu -->
<div class="guide">
    <app-module-guide
  title="Leave Management"
  subtitle="Review, approve and track employee leave requests and permission balances."
  [points]="[
    { label: 'Leave Requests', desc: 'View all pending, approved, and rejected leave applications. Approve or reject with a reason.' },
    { label: 'Permission Requests', desc: 'Manage short-duration permission requests — early leave, late arrival, or hourly absence.' },
    { label: 'Leave Balances', desc: 'Check an employee\'s remaining leave days, carried-forward balances, and accruals.' },
  ]">
</app-module-guide>
</div>

<div class="over-view">
    <!-- <h2 class="dynamic-heading">{{ tableHeading }}</h2> -->
    <nav class="sub-nav">
        <ul>
            <button (click)="show('list')">
                <li class="sub-item" [ngClass]="{ 'active': active === 'list' }">Leave Request
                </li>
            </button>
             <span class="br"></span>
            <!-- <button (click)="show('wfh')">
                <li class="sub-item" [ngClass]="{ 'active': active === 'wfh' }">WFH Request</li>
            </button>
             <span class="br"></span> -->
            <button (click)="show('permission')">
                <li class="sub-item" [ngClass]="{ 'active': active === 'permission' }">
                    Permission Request</li>
            </button>
            <span class="br" *ngIf="deptId === 1"></span>
            <button (click)="show('balances')" *ngIf="deptId === 1">
                <li class="sub-item" [ngClass]="{ 'active': active === 'balances' }">Balances</li>
            </button>
        </ul>
    </nav>


</div>
<!-- <div>
    <hr>
</div> -->



<div>
    <app-leave-request *ngIf="active === 'list'"></app-leave-request>
    <!-- <app-work-from-home *ngIf="active === 'wfh'"></app-work-from-home> -->
    <app-permission-request *ngIf="active === 'permission'"></app-permission-request>
    <app-balances-accruals *ngIf="active === 'balances'"></app-balances-accruals>
</div>
