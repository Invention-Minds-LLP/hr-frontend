<div class="card">
    <h2>Create Job Vacancy</h2>
  
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid">
        <label>
          <span>Title *</span>
          <input formControlName="title" placeholder="e.g., Senior Engineer" />
        </label>
  
        <label>
            <span>Department *</span>
            <select formControlName="departmentId">
              <option [ngValue]="null">Select department</option>
              <option *ngFor="let d of departments" [ngValue]="d.id">
                {{ d.name }}
              </option>
            </select>
          </label>
  
        <label>
          <span>Location</span>
          <input formControlName="location" placeholder="e.g., Chennai" />
        </label>
  
        <label>
          <span>Headcount *</span>
          <input formControlName="headcount" type="number" min="1" />
        </label>

        <!-- Round order. Two designations in the same department often need
             opposite orders, so it is chosen per job rather than per
             department. Blank = the department's sequence. -->
        <label>
          <span>Interview sequence</span>
          <select formControlName="roundTemplateId" [attr.disabled]="roundTemplates.length ? null : true">
            <option [ngValue]="null">
              {{ roundTemplates.length ? "Use the department's sequence" : 'None saved yet — built-in order applies' }}
            </option>
            <option *ngFor="let t of roundTemplates" [ngValue]="t.id">
              {{ t.name }}{{ t.isDefault ? ' (default)' : '' }}
            </option>
          </select>
        </label>
      </div>

      <div class="flow-preview">
        Candidates for this job will go through: <b>{{ chosenFlow }}</b>
      </div>
  
      <div class="actions">
        <button type="submit" [disabled]="saving">Create</button>
        <span class="error" *ngIf="error">{{ error }}</span>
      </div>
    </form>
  </div>
