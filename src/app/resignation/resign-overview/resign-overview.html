<!-- Submenu -->
<div class="guide">
    <app-module-guide
  title="Resignation"
  subtitle="Manage employee resignations, exit interviews, and full and final settlement."
  [points]="[
    { label: 'All Resignations', desc: 'View submitted resignation letters. Track notice period start, last working day, and current status.' },
    { label: 'Exit Interview', desc: 'Schedule and record exit interviews to capture feedback from departing employees.' },
    { label: 'Clearances', desc: 'Track asset handover, system access revocation, and departmental clearance before relieving.' },
    { label: 'Notice Period', desc: 'Monitor notice period compliance. HR can approve early relieving or waive-off the notice period.' }
  ]">
</app-module-guide>
</div>
<nav class="sub-nav">
    <!-- <h2 >{{tebleHaeding}}</h2> -->
    <ul>
        <button (click)="show('list')"><li class="sub-item" [ngClass]="{ 'active': active === 'list' }" >All Resignation</li></button>
        <div class="br" *ngIf="roleId !== 4"></div>
       <button (click)="show('exit')" *ngIf="roleId !== 4"> <li class="sub-item" [ngClass]="{ 'active': active === 'exit' }" >Exit Interview</li></button>
        <div class="br" *ngIf="roleId !== 4"></div>
        <button (click)="show('clearance')" *ngIf="roleId !== 4"> <li class="sub-item" [ngClass]="{ 'active': active === 'clearance' }" >Clearance</li></button>
    </ul>
</nav>

    <hr>

<div>
    <app-resignation-form *ngIf="active === 'form'"></app-resignation-form>
    <app-resignation-list *ngIf="active === 'list'"></app-resignation-list>
    <app-exit-interview-list *ngIf="active === 'exit'"></app-exit-interview-list>
    <app-survey-list *ngIf="active === 'survey'"></app-survey-list>
    <app-clearances *ngIf="active === 'clearance'"></app-clearances>
</div>
