<div class="guide">
    <app-module-guide
  title="Evaluation & Tests"
  subtitle="Build question banks, create tests, assign them to candidates or employees, and track results."
  [points]="[
    { label: 'Question Bank', desc: 'Maintain a library of questions organised by topic and difficulty for reuse across tests.' },
    { label: 'Test Creation', desc: 'Build timed tests by picking questions from the question bank.' },
    { label: 'Assign Tests', desc: 'Assign tests to specific employees or link them to training programs.' },
    { label: 'Candidate Tests', desc: 'Tests can also be assigned to job applicants during interview rounds.' },
    { label: 'Results & Scoring', desc: 'Auto-scored results are available immediately after submission.' }
  ]">
</app-module-guide>
</div>

        <div class="br"></div>
        <button><li class="sub-item" [ngClass]="{ 'active': active === 'assigned' }" (click)="show('assigned')">Assigned Tests</li></button>
    </ul>
</nav>
