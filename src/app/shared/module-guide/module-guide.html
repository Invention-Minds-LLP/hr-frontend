<div class="module-guide">
  <div class="guide-header" (click)="toggle()">
    <div class="guide-left">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span class="guide-module-name">{{ title }}</span>
      <span class="guide-sep">—</span>
      <span class="guide-short-desc">{{ subtitle }}</span>
    </div>
    <button class="guide-toggle" [class.open]="expanded" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      {{ expanded ? 'Hide' : 'What can I do here?' }}
    </button>
  </div>

  @if (expanded) {
    <div class="guide-body">
      <div class="guide-points">
        @for (point of points; track point.label) {
          <div class="guide-point">
            <div class="guide-point-dot"></div>
            <div class="guide-point-text">
              <span class="guide-point-label">{{ point.label }}</span>
              <span class="guide-point-desc">{{ point.desc }}</span>
            </div>
          </div>
        }
      </div>
    </div>
  }
</div>
