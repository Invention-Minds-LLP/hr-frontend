<div>
    <app-employee-form *ngIf="active === 'form'" [employeeData]="selectedEmployee"
        (closeForm)="onFormClose($event)"></app-employee-form>
    <app-employee-list *ngIf="active === 'list'" (editEmployee)="onEditEmployee($event)"></app-employee-list>
    <!-- <app-manage-attendance *ngIf="active === 'attendance'"></app-manage-attendance> -->
    <!-- <app-unreported-employee *ngIf="active === 'absent'"></app-unreported-employee> -->
    <div *ngIf="active === 'upload'">
        <div class="upload-section">

            <h2>Bulk Employee Excel Upload</h2>
            <div class="filters">
      <div class="field">
        <label for="year">Year</label>
        <input
          id="year"
          type="number"
          [(ngModel)]="uploadYear"
          min="2000"
          max="2100"
          placeholder="Enter year"
        />
      </div>

      <div class="field">
        <label for="month">Month</label>
        <select id="month" [(ngModel)]="uploadMonth">
          <option [ngValue]="null">Select month</option>
          <option [ngValue]="1">January</option>
          <option [ngValue]="2">February</option>
          <option [ngValue]="3">March</option>
          <option [ngValue]="4">April</option>
          <option [ngValue]="5">May</option>
          <option [ngValue]="6">June</option>
          <option [ngValue]="7">July</option>
          <option [ngValue]="8">August</option>
          <option [ngValue]="9">September</option>
          <option [ngValue]="10">October</option>
          <option [ngValue]="11">November</option>
          <option [ngValue]="12">December</option>
        </select>
      </div>
    </div>

          
            <!-- Drag & Drop Zone -->
            <div
              class="dropzone"
              (drop)="onDrop($event)"
              (dragover)="allowDrop($event)"
            >
              <p>Drag & drop Excel file here, or click to upload</p>
              <input type="file" accept=".xlsx,.xls" (change)="onFileSelected($event)" />
            </div>
          
            <!-- Uploading spinner -->
            <div *ngIf="uploading" class="uploading">
              Uploading... Please wait...
            </div>
          
            <!-- Logs -->
            <div *ngIf="logs.length > 0" class="logs">
              <h3>Upload Logs</h3>
              <pre>{{ logs.join('\n') }}</pre>
            </div>
          
            <!-- Error Report -->
            <div *ngIf="errorReportUrl" class="error-report">
              <a [href]="errorReportUrl" download>
                Download Error Report Excel
              </a>
            </div>
          
          </div>
          
    </div>
    <app-survey-list *ngIf="active === 'survey'" ></app-survey-list>
</div>
