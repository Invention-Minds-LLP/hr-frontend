<!-- Submenu -->
<div class="guide">
    <app-module-guide
  title="Appraisal"
  subtitle="Conduct, review, and track employee performance appraisals across cycles."
  [points]="[
    { label: 'Managerial Appraisal', desc: 'Review and submit appraisal ratings for your direct reports across performance criteria.' },
    { label: 'Dept Performance Indicator', desc: 'View aggregated performance scores by department to identify trends and top performers.' },
    { label: 'Appraisal Cycles', desc: 'Appraisals are organized by cycle (e.g. Q1 2025). Each cycle has self, manager, and HR reviews.' },
    { label: 'Final Decision', desc: 'HR records the final outcome — Promoted, Retained, Increment, or Probation — after all reviews.' }
  ]">
</app-module-guide>
</div>
<nav class="sub-nav">
    <ul>
        <button><li class="sub-item" [ngClass]="{ 'active': active === 'list' }" (click)="show('list')">Managerial Appraisal</li></button>
        <!-- <div class="br"></div> -->
        <!-- <button><li class="sub-item" [ngClass]="{ 'active': active === 'self' }" (click)="show('self')">Self Appraisal</li></button> -->
        <div class="br"></div>
       <button> <li class="sub-item" [ngClass]="{ 'active': active === 'dept' }" (click)="show('dept')">Dept Performance Indicator</li></button>
        <div class="br"></div>
       <button *ngIf="!isHRExecutive"> <li class="sub-item" [ngClass]="{ 'active': active === 'rating' }" (click)="show('rating')">Weekly Rating</li></button>
        <div class="br" *ngIf="canManageQuestions"></div>
       <button *ngIf="canManageQuestions"> <li class="sub-item" [ngClass]="{ 'active': active === 'questions' }" (click)="show('questions')">Review Questions</li></button>
        <div class="br" *ngIf="canManageQuestions"></div>
       <button *ngIf="canManageQuestions"> <li class="sub-item" [ngClass]="{ 'active': active === 'templates' }" (click)="show('templates')">Manage Templates</li></button>
    </ul>
</nav>
<!-- <div>
    <hr>
</div> -->


<div>
    <app-apprasial-form *ngIf="active === 'form'" [selectedAppraisal]="selectedAppraisal" [formType]="formType" (formSubmitted)="onFormSubmitted()" (backToList)="show('list')"></app-apprasial-form>
    <app-appraisal-review-form *ngIf="active === 'review'"
        [appraisalId]="selectedAppraisal?.id"
        [level]="reviewLevel"
        [selectedAppraisal]="selectedAppraisal"
        [readOnly]="reviewReadOnly"
        (submitted)="onFormSubmitted()"
        (backToList)="show('list')"></app-appraisal-review-form>
    <app-appraisal-table *ngIf="active === 'list'" (editAppraisal)="onEditAppraisal($event)"></app-appraisal-table>
    <!-- <app-self-appraisal *ngIf="active === 'self'"></app-self-appraisal> -->
    <app-dept-performance *ngIf="active === 'dept'"></app-dept-performance>
    <app-weekly-rating-overview *ngIf="active === 'rating'"></app-weekly-rating-overview>
    <app-review-questions-master *ngIf="active === 'questions'"></app-review-questions-master>
    <app-performance-template-manager *ngIf="active === 'templates'"></app-performance-template-manager>
</div>
